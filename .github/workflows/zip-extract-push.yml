name: "解压Zip并推送仓库"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Zip文件直链(需可直接下载，会自动解压后推送源码)'
        required: true
      target_repo:
        description: '目标仓库名(简写如myzip，会自动推送至你的用户名/myzip；或完整格式owner/repo)'
        required: true
        default: ''
      create_repo:
        description: '若目标仓库不存在是否自动创建(true/false)'
        required: false
        default: 'true'
      version:
        description: '版本号(可选，如v1.0.0，会自动创建Git Tag)'
        required: false
        default: ''
      branch:
        description: '推送到的分支名(默认main)'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: zip-extract-${{ github.event.inputs.target_repo }}
  cancel-in-progress: false

jobs:
  extract_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: 确定目标仓库全称
        id: repo
        run: |
          INPUT="${{ inputs.target_repo }}"
          if [[ "$INPUT" == *"/"* ]]; then
            FULL_NAME="$INPUT"
          else
            FULL_NAME="${{ github.actor }}/$INPUT"
          fi
          echo "full_name=$FULL_NAME" >> "$GITHUB_OUTPUT"
          echo "✅目标仓库：$FULL_NAME"

      - name: 下载并解压Zip
        id: extract
        run: |
          set -euo pipefail
          echo "⬇️正在下载 Zip..."
          wget -q -O archive.zip "${{ github.event.inputs.zip_url }}" || {
            echo "::error::下载失败，请检查链接是否可直接访问"
            exit 1
          }
          echo "✅下载完成"

          echo "📦检查Zip格式..."
          if ! file archive.zip | grep -qiE 'Zip archive|compressed'; then
            echo "::error::文件不是有效的Zip压缩包"
            exit 1
          fi

          EXTRACT_DIR=$(mktemp -d)
          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

          echo "📂正在解压..."
          unzip -q archive.zip -d "$EXTRACT_DIR" || {
            echo "::error::解压失败，文件可能已损坏"
            exit 1
          }
          echo "✅解压完成"

          # 若压缩包内只有单层目录，将其内容上移一层
          if [ "$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && [ "$(find "$EXTRACT_DIR" -maxdepth 1 -type f | wc -l)" = "0" ]; then
            echo "🧹检测到单层目录，上移内容..."
            SUB=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)
            tmp=$(mktemp -d)
            cp -a "$SUB/." "$tmp/"
            rm -rf "$EXTRACT_DIR"/*
            cp -a "$tmp/." "$EXTRACT_DIR/"
            rm -rf "$tmp"
            echo "✅已上移"
          fi

          echo "📁解压后的文件数量：$(find "$EXTRACT_DIR" -type f | wc -l)"
          echo "✅解压完成"

      - name: 推送到目标仓库
        run: |
          set -euo pipefail
          FULL_NAME="${{ steps.repo.outputs.full_name }}"
          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"
          BRANCH="${{ github.event.inputs.branch_path }}"
          BRANCH="${BRANCH:-main}"

          # 确认/创建目标仓库
          if gh repo view "$FULL_NAME" &>/dev/null; then
            echo "✅目标仓库已存在"
          else
            if [ "$CREATE_REPO" = "true" ]; then
              echo "🏗️目标仓库不存在，正在创建..."
              gh repo create "$FULL_NAME" --public --clone=false --confirm
              sleep 5
              echo "✅仓库已创建"
            else
              echo "::error::目标仓库不存在且未开启自动创建"
              exit 1
            fi
          fi

          GIT_USER_NAME=$(gh api user -q '.login')
          GIT_USER_ID=$(gh api user -q '.id')
          GIT_USER_EMAIL="${GIT_USER_ID}+${GIT_USER_NAME}@users.noreply.github.com"
          echo "👤提交身份：$GIT_USER_NAME <$GIT_USER_EMAIL>"

          PUSH_DIR=$(mktemp -d)
          cp -a "$EXTRACT_DIR/." "$PUSH_DIR/"
          cd "$PUSH_DIR"

          # 删除超过99MB的大文件（GitHub限制单文件100MB）
          find . -type f -size +99M -delete
          echo "✅已清理超大文件"

          git init -b "$BRANCH"
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add .

          if [ -n "$VERSION" ]; then
            COMMIT_MSG="release: $VERSION"
          else
            COMMIT_MSG="📦解压Zip并推送源码"
          fi

          git commit -m "$COMMIT_MSG" || {
            echo "⚠️无文件变更，跳过推送"
            exit 0
          }

          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${FULL_NAME}.git"
          git remote add origin "$AUTH_URL"
          git push -u origin "$BRANCH" --force

          if [ -n "$VERSION" ]; then
            echo "🏷️创建Tag：$VERSION"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION" --force || echo "⚠️Tag推送失败（可能权限不足）"
          fi

          echo ""
          echo "🎉推送完成"
          echo "📤仓库：$FULL_NAME($BRANCH)"
          echo "👤提交者：$GIT_USER_NAME"
          echo "📝信息：$COMMIT_MSG"
          if [ -n "$VERSION" ]; then
            echo "🏷️Tag：$VERSION"
          fi
        env:
          VERSION: ${{ github.event.inputs.version }}
          CREATE_REPO: ${{ github.event.inputs.create_repo }}

      - name: 清理临时文件
        if: always()
        run: |
          rm -rf "${{ steps.extract.outputs.extract_dir }}" 2>/dev/null || true
